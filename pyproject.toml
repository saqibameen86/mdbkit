[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdbkit"
version = "0.3.1"
description = "Offline toolkit for MongoDB 4.4+ structured logs: log analysis, slow-query shapes, connection churn, and deterministic index advice. A spiritual successor to mtools' log tools."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Saqib Ameen Subhan" }]
keywords = ["mongodb", "logs", "logv2", "mtools", "index", "dba", "slow-query"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mdbkit = "mdbkit.cli:main"

[project.urls]
Homepage = "https://github.com/CHANGEME/mdbkit"
Issues = "https://github.com/CHANGEME/mdbkit/issues"

[tool.setuptools.packages.find]
include = ["mdbkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
