[build-system]
# Capped so a future setuptools cannot break the build: `license = { text }`
# is deprecated (removal announced for 2027), and the SPDX form needs
# setuptools 77+, which no longer installs on Python 3.8.
requires = ["setuptools>=61,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "mdbkit"
version = "0.8.0"
description = "Offline toolkit for MongoDB 4.4 to 9.0 logs and diagnostics: slow-query shapes, index advice and index usage, incident triage, sharded clusters, multi-instance hosts, startup configuration audit, FTDC decoding. A spiritual successor to mtools' log tools."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Saqib Ameen Subhan" }]
keywords = [
    "mongodb", "mongodb-logs", "logv2", "mtools", "mloginfo", "mongod",
    "slow-query", "slow-query-log", "log-analysis", "log-parser",
    "index-advisor", "dba", "sre", "devops", "ftdc", "diagnostic-data",
    "explain-plan", "query-performance", "database-performance",
    "replica-set", "wiredtiger", "troubleshooting", "incident-response",
    "sharding", "mongos", "sharded-cluster", "chunk-migration", "index-usage",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Database",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mdbkit = "mdbkit.cli:main"

[project.urls]
Homepage = "https://github.com/saqibameen86/mdbkit"
Repository = "https://github.com/saqibameen86/mdbkit"
Documentation = "https://github.com/saqibameen86/mdbkit#readme"
Issues = "https://github.com/saqibameen86/mdbkit/issues"
Changelog = "https://github.com/saqibameen86/mdbkit/releases"

[tool.setuptools.packages.find]
include = ["mdbkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
